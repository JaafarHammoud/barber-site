name: Update gallery

on:
  push:
    branches: [main]
    paths:
      - 'assets/img/works/**'
      - 'assets/img/salon/**'
      - 'scripts/build-gallery.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-gallery.mjs
      - name: Commit updated list
        id: commit
        run: |
          git add js/gallery.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update gallery list"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
